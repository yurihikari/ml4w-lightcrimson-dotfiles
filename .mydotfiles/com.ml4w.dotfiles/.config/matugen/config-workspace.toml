# ============================================================================
# Lightweight matugen config for PER-WORKSPACE colors.
# ----------------------------------------------------------------------------
# Used by ~/.config/hypr/conf/custom/workspace-wallpapers.sh when "per-workspace
# colors" is enabled. It regenerates ONLY the Quickshell shell palette and
# deliberately omits every system-wide template + post_hook from the main
# config.toml (no kitty SIGUSR1, no `hyprctl reload`, no GTK theme reload),
# because those fire on every workspace switch and would be unbearably janky.
#
# Net effect: switching workspaces recolors the bar/popups/settings shell to
# match that workspace's wallpaper, while terminals/GTK apps/window borders
# keep the last *global* ML4W theme (changed only via the normal ML4W flow).
# ============================================================================

[config]

# Theme.qml (CustomTheme) reads this on `theme-manager reload`.
[templates.colorsjson]
input_path = '~/.config/matugen/templates/colors.json'
output_path = '~/.config/ml4w/colors/colors.json'

# Small single-color files some ML4W/Quickshell widgets read.
[templates.primary]
input_path = '~/.config/matugen/templates/primary'
output_path = '~/.config/ml4w/colors/primary'

[templates.secondary]
input_path = '~/.config/matugen/templates/secondary'
output_path = '~/.config/ml4w/colors/secondary'

[templates.on_surface]
input_path = '~/.config/matugen/templates/onsurface'
output_path = '~/.config/ml4w/colors/onsurface'

[templates.on_primary]
input_path = '~/.config/matugen/templates/onprimary'
output_path = '~/.config/ml4w/colors/onprimary'

# ML4W Dotfiles Settings shell palette (the separate settings Quickshell).
[templates.ml4w_dotfiles_settings]
input_path = '~/.config/matugen/templates/colors.json'
output_path = '~/.local/share/ml4w-dotfiles-settings/colors/colors.json'

# Quickshell overview palette.
[templates.quickshell_overview]
input_path = '~/.config/matugen/templates/quickshell-overview.qml'
output_path = '~/.config/quickshell/overview/common/Appearance.colors.qml'
