; Qt's palette for qt6ct (and qt5ct), generated with Matugen from the
; wallpaper. Roles, in order: WindowText, Button, Light, Midlight, Dark, Mid,
; Text, BrightText, ButtonText, Base, Window, Shadow, Highlight,
; HighlightedText, Link, LinkVisited, AlternateBase, NoRole, ToolTipBase,
; ToolTipText, PlaceholderText, Accent.
[Matugen]
mode=<* if {{ is_dark_mode }} *>dark<* else *>light<* endif *>
